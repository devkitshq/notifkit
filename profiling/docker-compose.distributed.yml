services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notifkit
      POSTGRES_USER: notifkit
      POSTGRES_PASSWORD: password
    ports:
      - "35432:5432"
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: "${DB_MEMORY:-1G}"

  redis:
    image: redis:7-alpine
    ports:
      - "36379:6379"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1.5}"
          memory: "${REDIS_MEMORY:-1G}"

  server1:
    build:
      context: ..
      dockerfile: profiling/Dockerfile
    environment:
      DATABASE_URL: postgres://notifkit:password@db:5432/notifkit
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: perf-admin-key
      LOG_LEVEL: warn
      HOST: 0.0.0.0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-100}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-0}
      SERVICES: ${SERVER1_SERVICES:-all}
    ports:
      - "35678:3000"
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: "${SERVER_CPUS:-1.0}"
          memory: "${SERVER_MEMORY:-1G}"

  server2:
    build:
      context: ..
      dockerfile: profiling/Dockerfile
    environment:
      DATABASE_URL: postgres://notifkit:password@db:5432/notifkit
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: perf-admin-key
      LOG_LEVEL: warn
      HOST: 0.0.0.0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-100}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-0}
      SERVICES: ${SERVER2_SERVICES:-all}
    ports:
      - "35679:3000"
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: "${SERVER_CPUS:-1.0}"
          memory: "${SERVER_MEMORY:-1G}"

  server3:
    build:
      context: ..
      dockerfile: profiling/Dockerfile
    environment:
      DATABASE_URL: postgres://notifkit:password@db:5432/notifkit
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: perf-admin-key
      LOG_LEVEL: warn
      HOST: 0.0.0.0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-100}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-0}
