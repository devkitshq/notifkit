name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a "chore: release" PR open with version bumps + changelogs built from
  # conventional commits. Merging that PR tags and creates the GitHub releases.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm --provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck:workspaces
      - run: npm run lint
      - run: npm test

      # Publishes every package whose current version isn't on npm yet, so
      # packages the release didn't bump are skipped.
      - name: Publish to npm
        run: |
          set -euo pipefail
          for dir in . packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
            else
              echo "publish $name@$version"
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done
