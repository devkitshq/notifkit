name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the badge job writes; everything else is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    # The badge step pushes to the `badges` branch on main.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Typecheck workspace packages
        run: npm run typecheck:workspaces

      - name: Lint
        run: npm run lint

      # ubuntu-latest ships Docker, so the testcontainers suites run here even
      # though they cannot locally. This is the only place the real coverage
      # number exists.
      - name: Test
        id: test
        run: npm test

      - name: Generate coverage badge
        # Runs even when the suite fails its thresholds, so the badge reports
        # what coverage actually is rather than going stale on a red build.
        # Only runs if the test step was actually executed (not skipped due to earlier failure).
        if: always() && steps.test.outcome != 'skipped'
        id: badge
        run: node scripts/coverage-badge.mjs --out badge/coverage.json

      - name: Publish badge
        # steps.badge.outcome guards the case where the suite crashed outright
        # and never wrote a summary — no badge is better than a misleading one.
        if: always() && steps.badge.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCT: ${{ steps.badge.outputs.pct }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp badge/coverage.json "$tmp/coverage.json"
          cd "$tmp"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -qm "chore(badge): coverage ${PCT}%"
          # A single-commit orphan branch — the badge has no history worth
          # keeping, and force-pushing stops it growing without bound.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      # Scaffolds an app from this commit's create-notifkit, points it at this
      # commit's notifkit, and runs the README flow end to end: dev, setup,
      # send, then checks the console provider printed the notification.
      - name: create-notifkit smoke test
        run: |
          set -euo pipefail
          npm run build -w create-notifkit
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          npm pack -w create-notifkit --pack-destination "$RUNNER_TEMP" >/dev/null
          cd "$RUNNER_TEMP"
          npm exec --yes --package="$RUNNER_TEMP/$(ls create-notifkit-*.tgz)" -- \
            create-notifkit smoke-app --no-install
          cd smoke-app
          npm install
          npm install "$RUNNER_TEMP/$(cd .. && ls notifkit-*.tgz)"
          npm run typecheck
          npm run dev > server.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf localhost:3000/health >/dev/null && break; sleep 2; done
          npm run setup
          npm run send
          for _ in $(seq 1 30); do grep -q "PUSH NOTIFICATION" server.log && break; sleep 1; done
          grep -q "PUSH NOTIFICATION" server.log || { cat server.log; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
