name: Publish

on:
  push:
    branches: [publish]
  pull_request:
    branches: [publish]

permissions:
  contents: read
  id-token: write # required for npm --provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Make this a required status check on `publish` so only PRs from main can merge.
  source-is-main:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ github.head_ref }}" = main || { echo "Only main can be merged into publish"; exit 1; }

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Backstop for direct pushes: the files must match main exactly (a PR merge
      # commit isn't on main, but its tree is).
      - name: Ensure publish matches main
        run: git diff --quiet HEAD origin/main || { echo "publish differs from main; merge main only"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck:workspaces
      - run: npm run lint
      - run: npm test

      # Publishes every package whose current version isn't on npm yet, so
      # unbumped packages are skipped instead of failing the run.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in . packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
            else
              echo "publish $name@$version"
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done
